name: CI - Testes Automatizados

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Segunda-feira às 06:00 UTC (03:00 horário de Brasília)
    - cron: '0 6 * * 1'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  testes:
    name: Executar testes e gerar relatório
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes automatizados
        run: npm run test:ci

      - name: Publicar relatório de testes no GitHub
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Relatório Mocha
          path: reports/junit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Gerar resumo da execução
        if: always()
        run: |
          echo "## Resultado da Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repositório | \`${{ github.repository }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Evento | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | #${{ github.run_number }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Relatórios gerados:" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`reports/junit.xml\` (JUnit XML)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`reports/index.html\` (relatório HTML Mochawesome)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Os arquivos também ficam disponíveis como **artifact** desta execução." >> "$GITHUB_STEP_SUMMARY"

      - name: Armazenar relatórios na pipeline
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-testes-run-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: error
